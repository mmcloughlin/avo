name: create-pull-request
description: Create Pull Request
inputs:
  bot:
    description: "Bot username"
    required: false
    default: "cadobot[bot]"
  app_id:
    description: "Bot App ID"
    required: true
  app_private_key:
    description: "Bot App Private Key"
    required: true
  title:
    description: "Pull request title"
    required: true
  branch:
    description: "Branch name"
    required: true
  body:
    description: "Body of the pull request"
    required: true
  draft:
    description: "Create draft pull request"
    required: false
    default: false
runs:
  using: composite
  steps:
    - name: Get Bot User
      id: bot
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const res = await github.rest.users.getByUsername({username: '${{ inputs.bot }}'});
          for (const [key, value] of Object.entries(res.data)) {
            core.setOutput(key, value)
          }
    - name: Generate App Token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      id: app
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.app_private_key }}
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ steps.app.outputs.token }}
        commit-message: ${{ inputs.title }}
        author: "${{ steps.bot.outputs.login }} <${{ steps.bot.outputs.id }}+${{ steps.bot.outputs.login }}@users.noreply.github.com>"
        branch: ${{ inputs.branch }}
        base: master
        delete-branch: true
        draft: ${{ inputs.draft }}
        title: ${{ inputs.title }}
        body: ${{ inputs.body }}
