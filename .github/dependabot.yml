version: 2
updates:
  # Dependabot updates SHA pins in place, including the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: .github
    groups:
      actions:
        patterns:
          - "*"
  # Group golang.org/x modules, which are released together.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: all
    groups:
      golang-x:
        patterns:
          - golang.org/x/*
