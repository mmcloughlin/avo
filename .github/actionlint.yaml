self-hosted-runner:
  labels: []

config-variables: null

paths:
  # packages.yml is generated by tests/thirdparty/make_workflow.go. A
  # project's job is kept visible but permanently disabled with `if: false`
  # while its known issue is open, so the job stays discoverable instead of
  # disappearing from the workflow.
  .github/workflows/packages.yml:
    ignore:
      - 'constant expression "false" in condition'
