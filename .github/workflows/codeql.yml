name: codeql
permissions:
  contents: read
on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "41 9 * * 1"
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          check-latest: true
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4
        with:
          languages: go
          build-mode: manual
          queries: security-and-quality
      # Build explicitly rather than relying on autobuild, which would also
      # build the generated test packages.
      - name: Build
        run: go build ./...
      - name: Analyze
        uses: github/codeql-action/analyze@d1ba80a13dd99fba24a470575428917156a28b43 # v4
