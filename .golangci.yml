version: "2"
linters:
  default: all
  disable:
    - cyclop
    - dupword
    - embeddedstructfieldcheck
    - err113
    - errname
    - exhaustruct
    - exhaustruct_v5
    - forbidigo
    - forcetypeassert
    - funcorder
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - goconst
    - godoclint
    - godox
    - gomodguard
    - gosec
    - iface
    - inamedparam
    - intrange
    - iotamixing
    - ireturn
    - lll
    - mnd
    - modernize
    - nlreturn
    - noctx
    - noinlineerr
    - nonamedreturns
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - recvcheck
    - rowserrcheck
    - tagliatelle
    - testpackage
    - thelper
    - unparam
    - usetesting
    - varnamelen
    - wastedassign
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    depguard:
      rules:
        main:
          allow:
            - github.com/mmcloughlin/avo
            - golang.org/x/
            - $gostd
    revive:
      enable-all-rules: true
      rules:
        - name: add-constant
          disabled: true
        - name: confusing-results
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: deep-exit
          disabled: true
        - name: empty-block
          disabled: true
        - name: enforce-switch-style
          disabled: true
        - name: flag-parameter
          disabled: true
        - name: function-length
          disabled: true
        - name: identical-switch-branches
          disabled: true
        - name: if-return
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: modifies-value-receiver
          disabled: true
        - name: package-comments
          disabled: true
        - name: package-directory-mismatch
          disabled: true
        - name: package-naming
          disabled: true
        - name: unexported-naming
          disabled: true
        - name: unhandled-error
          arguments:
            - fmt\.(P|Fp)rint(ln|f)?
            - math/rand\.Read
            - text/tabwriter\.Writer\.Flush
        - name: unnecessary-format
          disabled: true
        - name: unused-parameter
          disabled: true
        - name: unused-receiver
          disabled: true
        - name: use-any
          disabled: true
        - name: use-slices-sort
          disabled: true
    staticcheck:
      # The QF (quickfix) checks suggest stylistic rewrites.
      checks:
        - all
        - -QF*
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    generated: lax
    rules:
      # errcheck: Almost all programs ignore errors on these functions and in most cases it's ok
      - path: (.+)\.go$
        text: Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*printf?|os\.(Un)?Setenv). is not checked
      # gocritic: https://github.com/go-critic/go-critic/issues/762
      - path: (.+)\.go$
        text: ' with `(len|cap|real|imag)`'
      # We want to allow all caps in certain cases.
      - path: (.+)\.go$
        text: ALL_CAPS in Go names
      # Examples are illustrative and intentionally terse.
      - linters:
          - revive
        path: examples/
        text: '(bare-return|redefines-builtin-id):'
      # Pre-existing deprecated stdlib uses.
      - linters:
          - staticcheck
        path: (examples/md5x16/|internal/test/utils\.go)
        text: 'SA1019:'
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/mmcloughlin/avo)
  exclusions:
    generated: lax
